name: Extract Frames from ZIP

on:
  push:
    paths:
      - 'frames/*.zip'
      - '.github/workflows/extract-frames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract frame ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=(frames/*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP file found in frames/"
            exit 0
          fi

          rm -rf .frame_extract
          mkdir -p .frame_extract

          for zip_file in "${zips[@]}"; do
            echo "Extracting: $zip_file"
            unzip -o "$zip_file" -d .frame_extract
          done

          # Copy every extracted image into frames/ with a flat, predictable name.
          find .frame_extract -type f \( \
            -iname '*.jpg' -o \
            -iname '*.jpeg' -o \
            -iname '*.png' \
          \) -print0 | while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            cp "$file" "frames/$filename"
          done

          rm -rf .frame_extract

          echo "Extracted frames:"
          find frames -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | sort

      - name: Commit extracted frames
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-add images in case repository-level ignore rules exclude image files.
          git add -f frames/*.jpg frames/*.jpeg frames/*.png 2>/dev/null || true

          echo "Staged files:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No new frame files to commit."
            exit 0
          fi

          git commit -m "chore: extract animation frames"
          git push
