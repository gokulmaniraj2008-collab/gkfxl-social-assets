name: Extract Frames from ZIP

on:
  push:
    paths:
      - 'frames/*.zip'
      - 'index.html'
      - '.github/workflows/extract-frames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and normalize frames
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=(frames/*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP file found in frames/"
            exit 1
          fi

          rm -rf .frame_extract frames_web
          mkdir -p .frame_extract frames_web

          for zip_file in "${zips[@]}"; do
            echo "Extracting: $zip_file"
            unzip -o "$zip_file" -d .frame_extract
          done

          mapfile -d '' files < <(find .frame_extract -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | sort -z)

          if [ ${#files[@]} -ne 40 ]; then
            echo "Expected 40 frames, found ${#files[@]}"
            exit 1
          fi

          i=1
          for file in "${files[@]}"; do
            printf -v output 'frames_web/frame_%04d.jpg' "$i"
            cp "$file" "$output"
            i=$((i + 1))
          done

          rm -rf .frame_extract

          echo "Created 40 normalized frames:"
          ls -lh frames_web/frame_*.jpg

      - name: Commit extracted frames
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f frames_web/

          if git diff --cached --quiet; then
            echo "No frame changes to commit."
            exit 0
          fi

          git commit -m "chore: extract 40 web animation frames"
          git push
