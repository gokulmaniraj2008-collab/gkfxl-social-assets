name: GKFXL Media Pipeline

on:
  push:
    paths:
      - 'frames/*.zip'
      - 'input/**'
      - 'prompts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip imagemagick

      - name: Prepare frame sequence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .frame_extract frames_web
          mkdir -p .frame_extract frames_web

          zip_file=$(find frames -maxdepth 1 -type f -iname '*.zip' | head -n 1 || true)
          if [ -z "$zip_file" ]; then
            echo "No ZIP in frames/; nothing to prepare."
            exit 0
          fi

          unzip -o "$zip_file" -d .frame_extract >/dev/null
          mapfile -d '' files < <(find .frame_extract -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 | sort -z)

          count=${#files[@]}
          echo "Found $count image frames."
          if [ "$count" -lt 1 ]; then
            echo "No image frames found in ZIP."
            exit 1
          fi

          limit=$count
          if [ "$limit" -gt 40 ]; then limit=40; fi

          for ((i=1; i<=limit; i++)); do
            file="${files[$((i-1))]}"
            printf -v output 'frames_web/frame_%04d.jpg' "$i"
            magick "$file" -auto-orient -strip -quality 88 -resize '1920x1920>' "$output"
          done

          printf '{\n  "frameCount": %s,\n  "format": "jpg",\n  "maxWidth": 1920,\n  "generatedBy": "GKFXL Media Pipeline"\n}\n' "$limit" > frames_web/manifest.json
          rm -rf .frame_extract

      - name: Commit prepared frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frames_web/manifest.json frames_web/frame_*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No prepared frame changes.'
            exit 0
          fi
          git commit -m 'chore: prepare media frames'
          git push
