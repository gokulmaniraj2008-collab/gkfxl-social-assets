name: Deploy Demo Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frame sequence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .frame_extract frames_web
          mkdir -p .frame_extract frames_web

          zip_file="$(find frames -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$zip_file" ]; then
            echo "No frame ZIP found in frames/"
            exit 1
          fi

          unzip -q -o "$zip_file" -d .frame_extract

          mapfile -d '' source_frames < <(
            find .frame_extract -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | sort -z
          )

          if [ "${#source_frames[@]}" -eq 0 ]; then
            echo "No JPG/JPEG frames found in $zip_file"
            exit 1
          fi

          i=1
          for file in "${source_frames[@]}"; do
            printf -v name 'frame_%04d.jpg' "$i"
            cp "$file" "frames_web/$name"
            i=$((i + 1))
          done

          echo "Prepared $((i - 1)) frames"
          ls -lh frames_web | head

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
